<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendário Vintage 2026</title>
  
  <!-- Configurações do App (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="morango.png" />
  <meta name="theme-color" content="#4392ce" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="poster-container tema-jan">
    <!-- Cabeçalho Retrô -->
    <div class="poster-header">
      <div class="ano-e-tag">
        <span class="ano">2026</span>
        <span class="etiqueta-special">Emylly<br></span>
      </div>
      
      <div class="titulo-mes-container">
        <button class="nav-btn" onclick="mudarMes(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <h1 class="mes-titulo" id="nomeMes">JANUARY</h1>
        <button class="nav-btn" onclick="mudarMes(1)"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <div class="faixa-banners">
        <span class="banner-badge azul">Calendário</span>
        <span class="banner-badge vermelho">MEUS LEMBRETES</span>
      </div>
    </div>

    <!-- Grade do Calendário -->
    <div class="calendario-moldura">
      <div class="dias-semana-bar">
        <div class="semana-quadrado">s</div>
        <div class="semana-quadrado">m</div>
        <div class="semana-quadrado">t</div>
        <div class="semana-quadrado">w</div>
        <div class="semana-quadrado">t</div>
        <div class="semana-quadrado">f</div>
        <div class="semana-quadrado">s</div>
      </div>

      <div class="dias-grid" id="diasGrid"></div>
 

  <!-- JANELA FLUTUANTE (MODAL COM FONT AWESOME) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-cartao">
      <button class="modal-fechar" onclick="fecharModal()"><i class="fa-solid fa-xmark"></i></button>

      <div class="modal-header">
        <span class="modal-tag">LEMBRETE</span>
        <h3 id="modalDataTitulo">Dia 15 de Janeiro</h3>
      </div>

      <!-- SELETOR DE CATEGORIA COM NOVOS ÍCONES -->
      <div class="categoria-seletor">
        <label>Escolha a Categoria:</label>
        <div class="opcoes-icones">
          <button type="button" class="btn-icone ativo" onclick="selecionarIcone('fa-champagne-glasses', this)">
            <i class="fa-solid fa-champagne-glasses" style="color: rgb(74, 70, 140);"></i> Saídas
          </button>
          <button type="button" class="btn-icone" onclick="selecionarIcone('fa-compact-disc', this)">
            <i class="fa-solid fa-compact-disc" style="color: rgb(74, 70, 140);"></i> Shows
          </button>
          <button type="button" class="btn-icone" onclick="selecionarIcone('fa-money-check-dollar', this)">
            <i class="fa-solid fa-money-check-dollar" style="color: rgb(74, 70, 140);"></i> Pagamentos
          </button>
          <button type="button" class="btn-icone" onclick="selecionarIcone('fa-thumbtack', this)">
            <i class="fa-solid fa-thumbtack" style="color: rgb(74, 70, 140);"></i> Compromissos
          </button>
          <button type="button" class="btn-icone" onclick="selecionarIcone('fa-cake-candles', this)">
            <i class="fa-solid fa-cake-candles" style="color: rgb(74, 70, 140);"></i> Aniversário
          </button>
          <button type="button" class="btn-icone" onclick="selecionarIcone('fa-star', this)">
            <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i> Geral
          </button>
        </div>
      </div>

      <textarea id="modalTextoNota" placeholder="Escreva seu lembrete aqui..."></textarea>

      <div class="modal-acoes">
        <button class="btn-modal btn-excluir" onclick="excluirNotaModal()"><i class="fa-solid fa-trash"></i> Apagar</button>
        <button class="btn-modal btn-salvar" onclick="salvarNotaModal()"><i class="fa-solid fa-check"></i> Salvar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
